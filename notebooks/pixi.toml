[workspace]
name = "hpgr-notebooks"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[dependencies]
python = ">=3.12,<3.13"
jupyter-book = "==2.1.6"
nodejs = ">=22,<23"

[tasks]
build = "Rscript ../tools/build_notebook_site.R"
preview = "python -m http.server 8149 --bind 127.0.0.1 --directory _build/site-source/_build/html"

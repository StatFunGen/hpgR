# Based on the standard r-lib/actions v2 package-check workflow.
name: R package checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        r: [release]
        include:
          - os: ubuntu-latest
            r: devel
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - uses: r-lib/actions/check-r-package@v2
        with:
          build_args: 'c("--no-manual")'
      - name: Report detailed check failures
        if: failure()
        shell: Rscript {0}
        run: |
          logs <- list.files("check", pattern = "(00check[.]log|[.]Rout[.]fail)$",
                             recursive = TRUE, full.names = TRUE)
          for (path in logs) {
            text <- paste(tail(readLines(path, warn = FALSE), 200L), collapse = "\n")
            text <- gsub("%", "%25", text, fixed = TRUE)
            text <- gsub("\r", "%0D", text, fixed = TRUE)
            text <- gsub("\n", "%0A", text, fixed = TRUE)
            cat("::error title=", basename(path), "::", text, "\n", sep = "")
          }

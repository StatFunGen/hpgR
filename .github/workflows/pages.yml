name: Publish course notebooks

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'notebooks/**'
      - 'R/**'
      - 'DESCRIPTION'
      - 'tools/build_notebook_site.R'
      - 'tools/verify_notebook_site.R'
  pull_request:
    paths:
      - '.github/workflows/pages.yml'
      - 'notebooks/**'
      - 'R/**'
      - 'DESCRIPTION'
      - 'tools/build_notebook_site.R'
      - 'tools/verify_notebook_site.R'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.3'
          use-public-rspm: true

      - name: Install the R build dependency
        shell: Rscript {0}
        run: install.packages('jsonlite', repos = 'https://cloud.r-project.org')

      - name: Install the locked website environment
        uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.76.1
          working-directory: notebooks
          frozen: true
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}

      - name: Read the GitHub Pages configuration
        if: github.event_name != 'pull_request'
        id: pages
        uses: actions/configure-pages@v5

      - name: Build and verify approved notebooks
        working-directory: notebooks
        env:
          BASE_URL: ${{ github.event_name == 'pull_request' && format('/{0}', github.event.repository.name) || steps.pages.outputs.base_path }}
        run: pixi run build

      - name: Upload the verified website
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: notebooks/_build/site-source/_build/html

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
